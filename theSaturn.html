<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <title>Saturn</title>
    </head>
    <body class="solar-system-page">
        <h1>Welcome to Saturn</h1>
        <img id = 'saturn' src="https://solarsystem.nasa.gov/system/stellar_items/image_files/38_saturn_1600x900.jpg" alt="Saturn" width="500" height="300">
        <h2>Saturn is a Gas Giant</h2>
        <h3>Did you know?</h3>
        <p id="fact"></p>
        <button id="factButton">Random Fact About Saturn</button>
        <a href="theSolarSystem.html">Go Back</a>
        <script>
            const facts = [
                "Saturn is the largest planet in our solar system.",
                "Saturn has a prominent ring system.",
                "Saturn has at least 82 moons.",
                "Saturn is a gas giant, mostly composed of hydrogen and helium.",
                "Saturn has a faint ring system."
            ];

            const factButton = document.getElementById("factButton");
            const fact = document.getElementById("fact");

            factButton.addEventListener("click", function() {
                const randomNumber = Math.floor(Math.random() * facts.length);
                fact.textContent = facts[randomNumber];
            });
        </script>
    </body>
</html>
