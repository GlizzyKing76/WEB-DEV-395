<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <title>Jupiter</title>
    </head>
    <body class="jupiter-page">
        <h1>Welcome to Jupiter</h1>
        <img id = 'jupiter' src="https://upload.wikimedia.org/wikipedia/commons/8/84/Hubble_Visible_View_of_Jupiter.jpg" alt="Jupiter" width="300" height="300">
        <h2>Jupiter is a Gas Giant</h2>
        <h3>Did you know?</h3>
        <p id="fact"></p>
        <button id="factButton">Random Fact About Jupiter</button>
        <a href="theSolarSystem.html">Go Back</a>
        <script>
            const facts = [
                "Jupiter is the largest planet in our solar system.",
                "Jupiter has a prominent Great Red Spot, a giant storm.",
                "Jupiter has at least 79 moons.",
                "Jupiter is a gas giant, mostly composed of hydrogen and helium.",
                "Jupiter has a faint ring system."
            ];


            const factButton = document.getElementById("factButton");
            const fact = document.getElementById("fact");


            factButton.addEventListener("click", function() {
                const randomNumber = Math.floor(Math.random() * facts.length);
                fact.textContent = facts[randomNumber];
            });
        </script>
    </body>
</html>
