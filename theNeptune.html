<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Neptune</title>
        <style>
            body
            {
                background-image: url('https://wallpapercave.com/wp/wp9116463.jpg');
                text-align: center;
                color: white;
                padding: 20px 20px;
                background-size: cover;
            }

            h1
            {
                text-align: center;
                color: burlywood;
                text-shadow: 
                 0 0 10px burlywood,
                 0 0 20px burlywood,
                 0 0 30px brown;
            }

            a
            {
                display: block;
                color: white;
                padding: 10px 20px;

            }

            a:hover 
            {
                color: burlywood;
                text-shadow: 
                 0 0 10px burlywood,
                 0 0 20px burlywood,
                 0 0 30px brown;
            }

            h2
            {
                text-align: center;
                color: burlywood;
                animation: glow 2s infinite alternate;
            }

            @keyframes glow {
                from {
                    text-shadow: 0 0 5px burlywood, 0 0 10px burlywood, 0 0 15px brown;
                }
                to {
                    text-shadow: 0 0 20px burlywood, 0 0 30px burlywood, 0 0 40px brown;
                }
            }

            h3
            {
                text-align: center;
                color: burlywood;
            }
            
            button
            {
                background-color: black;
                color: burlywood;
                border: 2px solid burlywood;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;
            }

            p
            {
                color: burlywood;
                text-align: center;
            }



        </style>
    </head>
    <body>
        <h1>Welcome to Neptune</h1>
        <img id = 'neptune' src="https://upload.wikimedia.org/wikipedia/commons/8/84/Hubble_Visible_View_of_Jupiter.jpg" alt="Neptune" width="300" height="300">
        <h2>Neptune is a Gas Giant</h2>
        <h3>Did you know?</h3>
        <p id="fact"></p>
        <button id="factButton">Random Fact About Neptune</button>
        <a href="theSolarSystem.html">Go Back</a>
        <script>
            const facts = [
                "Neptune is the largest planet in our solar system.",
                "Neptune has a prominent Great Red Spot, a giant storm.",
                "Neptune has at least 14 moons.",
                "Neptune is a gas giant, mostly composed of hydrogen and helium.",
                "Neptune has a faint ring system."
            ];

            const factButton = document.getElementById("factButton");
            const fact = document.getElementById("fact");

            factButton.addEventListener("click", function() {
                const randomNumber = Math.floor(Math.random() * facts.length);
                fact.textContent = facts[randomNumber];
            });
        </script>
    </body>
</html>
