<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>The Earth</title>
        <style>
            body
            {
                background-color: black;
                text-align: center;
                color: white;
            }

            h1
            {
                background-color: Black;
                text-align: center;
                color: lightblue;

                text-shadow: 
                 0 0 10px lightblue,
                 0 0 20px lightblue,
                 0 0 30px blue;
            }

            a 
            {
                display: block;
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }

            a:hover 
            {
                color: cyan;
                text-shadow: 
                 0 0 10px cyan,
                 0 0 20px blue;
            }

            h2
            {
                background-color: Black;
                text-align: center;
                color: lightblue;
            }

            h3
            {
                background-color: Black;
                text-align: center;
                color: lightblue;
            }

            #earth.spinning 
            {
                animation: spin 5s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h1>Welcome to the Earth</h1>
        <!--<img src="https://cdn.pixabay.com/photo/2011/12/13/14/28/earth-11009_1280.jpg" alt="The Earth" width="300" height="300">-->
        <img id="earth" src="https://cdn.pixabay.com/photo/2011/12/13/14/28/earth-11009_1280.jpg" alt="The Earth" width="300" height="300">
        <h2>The Earth is our home planet</h2>
        <h3>Facts about the Earth</h3>
        <a href="day 2.html">Go Back</a>
        <script>
            const earth = document.getElementById("earth");
            earth.addEventListener("click", function() {
                earth.classList.toggle("spinning");
            });
        </script>
    </body>
</html>
